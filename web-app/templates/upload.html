<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Scanner</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
    }

    input, button {
      font: inherit;
    }

    #preview {
      max-width: 100%;
      max-height: 600px;
    }

    #message {
      min-height: 1.5em;
    }
  </style>

  <script
    src="{{ url_for('static', filename='upload.js') }}"
    defer>
  </script>
</head>
<body>
  <form id="receipt-review">
  <h2>Review receipt details</h2>

  <p>
    <label>
      Merchant
      <input name="merchant" type="text" required>
    </label>
  </p>

  <p>
    <label>
      Receipt date
      <input name="date" type="date" required>
    </label>
  </p>

  <p>
    <label>
      Subtotal ($)
      <input name="subtotal" type="number" step="0.01">
    </label>
  </p>

  <p>
    <label>
      Tax ($)
      <input name="tax" type="number" step="0.01">
    </label>
  </p>

  <p>
    <label>
      Total ($)
      <input name="total" type="number" step="0.01" required>
    </label>
  </p>

  <p>
    <label>
      Category
      <select name="category">
        <option value="">Choose a category</option>
        <option value="food">Food</option>
        <option value="transport">Transport</option>
        <option value="shopping">Shopping</option>
        <option value="other">Other</option>
      </select>
    </label>
  </p>

  <button type="submit">Check details</button>
  <p id="review-message" role="status"></p>
</form>
  <main>
    <h1>Upload a receipt</h1>

    <p>
      <label for="receipt-file">Choose a receipt image</label>
    </p>

    <input
      id="receipt-file"
      type="file"
      accept="image/png,image/jpeg"
      aria-describedby="file-help message"
    >

    <p id="file-help">PNG or JPEG, up to 5 MB.</p>

    <p id="message" role="status" aria-live="polite"></p>

    <img
      id="preview"
      alt="Preview of your selected receipt"
      hidden
    >

    <p>
      <button id="remove-receipt" type="button" disabled>
        Remove receipt
      </button>
    </p>
  </main>
</body>
</html>
